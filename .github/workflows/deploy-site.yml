name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: apps/site
          node-version: 22
          package-manager: npm@latest
        env:
          PUBLIC_CONTACT_API_URL: https://app.hellowale.com/api/contact
          PUBLIC_HUBSPOT_PORTAL_ID: "149149943"
          PUBLIC_HUBSPOT_PARTNER_FORM_GUID: fc942536-05b9-4099-ba88-0462e575e367
          PUBLIC_HUBSPOT_HOST_FORM_GUID: 7c36f80f-5f19-4f67-b6b0-72bcc875e4b3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
