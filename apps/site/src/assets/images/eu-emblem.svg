<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="600">
<!--
  European emblem, constructed from the official graphical specification
  ("Graphical specifications for the European emblem", EU inter-institutional
  style guide). Every number below is the specification, not a design choice:

    - the fly is 1.5x the hoist                     -> 900 x 600
    - the twelve stars sit at equal intervals on an invisible circle whose
      radius is one third of the hoist height       -> 600 / 3  = 200
    - each star's five points lie on an invisible circle whose radius is one
      eighteenth of the hoist height                -> 600 / 18 = 33.333333
    - EU corporate blue #003399, Yellow 100% #FFCC00

  The star is drawn once as a unit pentagram and scaled by the specified
  radius, so the ratio is readable in the file instead of being baked into
  pre-multiplied coordinates. `euEmblemGeometry.test.ts` pins both radii.

  Do not hand-tune these numbers. If the programme office issues an official
  asset pack, replace this file wholesale and keep that test green.
-->
<rect width="900" height="600" fill="#039"/>
<g fill="#fc0" transform="translate(450,300)">
<path id="s" d="M0,-1 0.5877853,0.809017 -0.9510565,-0.309017H0.9510565L-0.5877853,0.809017z" transform="translate(0,200) scale(33.333333)"/>
<use xlink:href="#s" y="-400"/>
<g id="s5">
<use xlink:href="#s" transform="rotate(30) rotate(-30,0,200)"/>
<use xlink:href="#s" transform="rotate(60) rotate(-60,0,200)"/>
<use xlink:href="#s" transform="rotate(90) rotate(-90,0,200)"/>
<use xlink:href="#s" transform="rotate(120) rotate(-120,0,200)"/>
<use xlink:href="#s" transform="rotate(150) rotate(-150,0,200)"/>
</g>
<use xlink:href="#s5" transform="scale(-1,1)"/>
</g>
</svg>
